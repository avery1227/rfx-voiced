name: CI

on:
  push:
    branches: [main]
    # Documentation cannot break a build, and running one to find that out
    # burns several minutes per prose edit. Release is unaffected - a tag
    # always builds, whatever it touches.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failed build should say why, not print a wall of backtrace-less panics.
  RUST_BACKTRACE: 1

# One run per ref. A quick follow-up push should cancel the run it supersedes
# rather than queue behind it - the older result is about to be irrelevant.
# Releases are never cancelled: a half-pushed set of image tags is worse than
# a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # libopus is compiled from source by opusic-sys. The GitHub runners
      # already have cmake and g++, but pinning the expectation here means a
      # runner image change fails loudly instead of mysteriously.
      - name: Check native build deps
        run: cmake --version && c++ --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build release
        run: cargo build --release

      # Proves the artifact the egg actually runs is not broken in a way that
      # only shows at startup - a missing shared library, say. It exits
      # non-zero with no servers configured, which is the expected path here.
      - name: Smoke test the binary
        run: ./target/release/rfx-voiced help
