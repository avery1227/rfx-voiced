name: Release

# Tag-triggered, not push-triggered.
#
# A release is a thing operators pin to and a thing the Pelican egg can pull a
# prebuilt binary from. Cutting one on every commit to main would make "which
# version is that node running" unanswerable, and the answer to that question
# is the first thing anyone asks when a node misbehaves.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  binary:
    name: Linux binary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # Named with the target triple because the binary is glibc-linked: it
      # runs on the Debian the egg uses, and saying so in the filename saves
      # somebody discovering it the hard way on Alpine.
      - name: Package
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="rfx-voiced-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${NAME}"
          cp target/release/rfx-voiced "dist/${NAME}/"
          cp README.md egg-interophq-voice-node.json "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            egg-interophq-voice-node.json

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # libopus takes minutes to compile and does not change between
          # releases. Without a cache every tag pays for it again.
          cache-from: type=gha
          cache-to: type=gha,mode=max
